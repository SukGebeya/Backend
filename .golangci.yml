version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - bodyclose
    - dogsled
    - dupl
    - exhaustive
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    gocyclo:
      min-complexity: 20

    dupl:
      threshold: 150

    goconst:
      min-len: 3
      min-occurrences: 5
      ignore-string-values:
        - "ETB"

    exhaustive:
      default-signifies-exhaustive: true

    misspell:
      locale: US
      ignore-rules:
        - cancelled
        - cancelling
        - honoured

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy

    # The project convention is no comments unless logic is non-obvious, so the
    # doc-comment rules (exported, package-comments) are intentionally left out.
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    generated: strict
    paths:
      - docs
      - internal/db
      - internal/repository/mocks
      - internal/service/mocks
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocyclo
          - goconst
          - errcheck
      - path: internal/http/handler/
        linters:
          - dupl

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
