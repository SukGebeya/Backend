        maxLength: 2000
        type: string
      is_digital:
        type: boolean
      name:
        example: Traditional Ethiopian Coffee
        maxLength: 200
        minLength: 2
        type: string
      status:
        enum:
        - draft
        - active
        - archived
        example: active
        type: string
    type: object
  internal_http_handler.UpdateProfileRequest:
    properties:
      email:
        example: newemail@example.com
        type: string
      full_name:
        example: Abebe Bikila
        maxLength: 100
        minLength: 2
        type: string
      phone:
        example: "0911234567"
        type: string
    type: object
  internal_http_handler.UpdateVariantRequest:
    properties:
      attributes:
        additionalProperties: {}
        type: object
      compare_price_cents:
        example: 30000
        minimum: 1
        type: integer
      is_active:
        type: boolean
      price_cents:
        example: 25000
        minimum: 1
        type: integer
      title:
        example: 500g Ground Coffee
        maxLength: 200
        minLength: 2
        type: string
    type: object
  internal_http_handler.UserListResponse:
    properties:
      page:
        example: 1
        type: integer
      per_page:
        example: 20
        type: integer
      total:
        example: 42
        type: integer
      total_pages:
        example: 3
        type: integer
      users:
        items:
          $ref: '#/definitions/internal_http_handler.UserResponse'
        type: array
    type: object
  internal_http_handler.UserResponse:
    properties:
      created_at:
        example: "2024-01-15T10:30:00Z"
