      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handler.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Open a dispute (buyer)
      tags:
      - orders
  /orders/{id}/payment/refresh:
    post:
      description: Verifies the order's payment with Chapa immediately. Use it from
        the payment return page instead of waiting for the webhook.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Order with current status
          schema:
            $ref: '#/definitions/internal_http_handler.OrderResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Re-check payment status (buyer)
      tags:
      - orders
  /orders/checkout:
    post:
      consumes:
      - application/json
      description: Create an order from cart and initiate payment. Requires Idempotency-Key
        header to prevent duplicate payments.
      parameters:
      - description: Unique idempotency key to prevent duplicate payments
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Checkout details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.CheckoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Checkout result with payment URL
          schema:
            $ref: '#/definitions/internal_http_handler.CheckoutResponse'
        "400":
          description: Invalid request, empty cart, or missing Idempotency-Key
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Process checkout
      tags:
      - orders
  /payments/chapa/callback:
    get:
      description: Chapa calls this URL (CHAPA_CALLBACK_URL) after checkout. The query
        is only a hint; the payment is verified with Chapa before the order changes.
      parameters:
      - description: Transaction reference
        in: query
        name: trx_ref
        type: string
      - description: Transaction reference
        in: query
        name: tx_ref
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handler.WebhookAckResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      summary: Chapa payment callback
      tags:
      - webhooks
  /products:
    get:
      consumes:
      - application/json
      description: Paginated list of active products with their lowest price, current
        availability, primary image and shop. Search works in Amharic and English.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Search in product name and description
        in: query
        name: q
        type: string
      - description: Filter by category ID
        in: query
        name: category_id
        type: string
      - description: Filter by merchant (shop) ID
        in: query
        name: merchant_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of products
          schema:
            $ref: '#/definitions/internal_http_handler.ProductListResponse'
        "400":
          description: Invalid filter
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      summary: Browse products
      tags:
      - products
  /products/{slug}:
    get:
      consumes:
      - application/json
      description: Get an active product by ID or slug, with its variants (including
        how many units are available), images and shop.
      parameters:
      - description: Product ID or slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Product details with variants
          schema:
            $ref: '#/definitions/internal_http_handler.ProductDetailResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      summary: Get a product
      tags:
      - products
  /refresh:
    post:
      consumes:
      - application/json
      description: Get new access and refresh tokens using a valid refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens refreshed successfully
          schema:
            $ref: '#/definitions/internal_http_handler.TokenResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email or phone. Returns user info
        and authentication tokens.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            $ref: '#/definitions/internal_http_handler.AuthResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "409":
          description: Email or phone already registered
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /shops/{shop_slug}:
    get:
      consumes:
      - application/json
      description: Get public shop information by shop slug.
      parameters:
      - description: Shop slug
        in: path
        name: shop_slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Shop information
          schema:
            $ref: '#/definitions/internal_http_handler.ShopResponse'
        "404":
          description: Shop not found
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      summary: Get public shop information
      tags:
      - shops
  /users:
    get:
      consumes:
      - application/json
      description: Get a paginated list of all users. Admin access required.
      parameters:
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of users
          schema:
            $ref: '#/definitions/internal_http_handler.UserListResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "403":
          description: Admin access required
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently delete a user by ID. Admin access required.
      parameters:
      - description: User ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: User deleted successfully
        "400":
          description: Invalid user ID format
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "403":
          description: Admin access required
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - users
    get:
      consumes:
      - application/json
      description: Get a specific user's profile. Admin access required.
      parameters:
      - description: User ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            $ref: '#/definitions/internal_http_handler.UserResponse'
        "400":
          description: Invalid user ID format
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "403":
          description: Admin access required
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a user by ID
      tags:
      - users
  /users/me:
    get:
      consumes:
      - application/json
      description: Get the authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            $ref: '#/definitions/internal_http_handler.UserResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update the authenticated user's email or phone. At least one of
        email or phone must be provided.
      parameters:
      - description: Profile updates
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated user profile
          schema:
            $ref: '#/definitions/internal_http_handler.UserResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "409":
          description: Email or phone already in use
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
  /webhooks/chapa:
    post:
      consumes:
      - application/json
      description: Receives Chapa payment events. The signature is checked, the event
        is recorded once, and the payment is re-verified with Chapa asynchronously
        before any order changes.
      parameters:
      - description: HMAC-SHA256 of the payload
        in: header
        name: x-chapa-signature
        type: string
      - description: HMAC-SHA256 of the webhook secret
        in: header
        name: Chapa-Signature
        type: string
      - description: Webhook payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_SukGebeya_Backend_internal_chapa.WebhookPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handler.WebhookAckResponse'
        "400":
          description: Invalid payload
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "401":
          description: Invalid signature
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      summary: Handle Chapa webhook
      tags:
      - webhooks
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
