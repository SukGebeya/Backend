host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: https://github.com/natnael-alemayehu/sukgebeya
  description: |-
    A production-ready Go REST API boilerplate with authentication, notes, and user management.
    Features include JWT authentication, rate limiting, soft deletes, and Redis-based token storage.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Go Boilerplate API
  version: "1.0"
paths:
  /addresses:
    get:
      consumes:
      - application/json
      description: Get all addresses for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_http_handler.AddressResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List user's addresses
      tags:
      - addresses
    post:
      consumes:
      - application/json
      description: Create a new address for the authenticated user
      parameters:
      - description: Address details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.CreateAddressRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_http_handler.AddressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new address
      tags:
      - addresses
  /addresses/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an address
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_SukGebeya_Backend_pkg_response.ErrorResponse'
        "404":
