services:
  postgres:
    image: postgres:16-alpine
    container_name: sukgebeya-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sukgebeya-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  blnk:
    image: jerryenebeli/blnk:latest
    container_name: sukgebeya-blnk-dev
    ports:
      - "5001:5001"
    volumes:
      - ./blnk.json:/blnk.json
    command: >
      sh -c "blnk migrate up && blnk start"
    depends_on:
      blnk-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  blnk-postgres:
    image: postgres:16-alpine
    container_name: sukgebeya-blnk-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blnk
    ports:
      - "5433:5432"
    volumes:
      - blnk_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blnk"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sukgebeya-app-dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override for Docker networking (service names instead of localhost)
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
      REDIS_URL: redis:6379
      BLNK_BASE_URL: http://blnk:5001
      JWT_ACCESS_PRIVATE_KEY_PATH: /app/keys/access_private.pem
      JWT_ACCESS_PUBLIC_KEY_PATH: /app/keys/access_public.pem
      JWT_REFRESH_PRIVATE_KEY_PATH: /app/keys/refresh_private.pem
      JWT_REFRESH_PUBLIC_KEY_PATH: /app/keys/refresh_public.pem
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      blnk:
        condition: service_healthy

volumes:
  postgres_dev_data:
  redis_dev_data:
  blnk_postgres_dev_data:
  go_mod_cache:
