services:
  postgres:
    image: postgres:16-alpine
    container_name: sukgebeya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: sukgebeya-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  blnk:
    image: jerryenebeli/blnk:0.15.6
    container_name: sukgebeya-blnk
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "blnk migrate up && blnk start"
    environment:
      BLNK_SERVER_SECURE: "true"
      BLNK_SERVER_SECRET_KEY: ${BLNK_SECRET_KEY:?BLNK_SECRET_KEY is required}
    volumes:
      - ./blnk.json:/blnk.json
    depends_on:
      blnk-postgres:
        condition: service_healthy
      blnk-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  blnk-worker:
    image: jerryenebeli/blnk:0.15.6
    container_name: sukgebeya-blnk-worker
    entrypoint: ["blnk", "workers"]
    environment:
      BLNK_SERVER_SECURE: "true"
      BLNK_SERVER_SECRET_KEY: ${BLNK_SECRET_KEY:?BLNK_SECRET_KEY is required}
    restart: unless-stopped
    volumes:
      - ./blnk.json:/blnk.json
    depends_on:
      blnk:
        condition: service_healthy
    networks:
      - backend

  blnk-redis:
    image: redis:7-alpine
    container_name: sukgebeya-blnk-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  blnk-postgres:
    image: postgres:16-alpine
    container_name: sukgebeya-blnk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blnk
    volumes:
      - blnk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blnk"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend


  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sukgebeya-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PORT: "8080"
      JWT_ACCESS_PRIVATE_KEY_PATH: /app/keys/access_private.pem
      JWT_ACCESS_PUBLIC_KEY_PATH: /app/keys/access_public.pem
      JWT_REFRESH_PRIVATE_KEY_PATH: /app/keys/refresh_private.pem
      JWT_REFRESH_PUBLIC_KEY_PATH: /app/keys/refresh_public.pem
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      ENVIRONMENT: production
      BLNK_BASE_URL: http://blnk:5001
      BLNK_SECRET_KEY: ${BLNK_SECRET_KEY:?BLNK_SECRET_KEY is required}
      BLNK_ETB_LEDGER_ID: ${BLNK_ETB_LEDGER_ID:?BLNK_ETB_LEDGER_ID is required (run make seed-blnk)}
      BLNK_ESCROW_BALANCE_ID: ${BLNK_ESCROW_BALANCE_ID:?BLNK_ESCROW_BALANCE_ID is required}
      BLNK_REVENUE_BALANCE_ID: ${BLNK_REVENUE_BALANCE_ID:?BLNK_REVENUE_BALANCE_ID is required}
      BLNK_PROCESSING_FEE_BALANCE_ID: ${BLNK_PROCESSING_FEE_BALANCE_ID:?BLNK_PROCESSING_FEE_BALANCE_ID is required}
      CHAPA_MODE: ${CHAPA_MODE:-live}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:?CHAPA_SECRET_KEY is required}
      CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET:?CHAPA_WEBHOOK_SECRET is required}
      CHAPA_CALLBACK_URL: ${CHAPA_CALLBACK_URL:?CHAPA_CALLBACK_URL is required}
      CHAPA_RETURN_URL: ${CHAPA_RETURN_URL:?CHAPA_RETURN_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-5}
      ORDER_PAYMENT_TIMEOUT: ${ORDER_PAYMENT_TIMEOUT:-1h}
      AUTO_CONFIRM_DELIVERY_DAYS: ${AUTO_CONFIRM_DELIVERY_DAYS:-7}
      PAYOUT_MIN_CENTS: ${PAYOUT_MIN_CENTS:-10000}
      PAYOUT_DAILY_LIMIT_CENTS: ${PAYOUT_DAILY_LIMIT_CENTS:-10000000}
      REQUIRE_PHONE_VERIFICATION: ${REQUIRE_PHONE_VERIFICATION:-true}
      SMS_PROVIDER: ${SMS_PROVIDER:-afromessage}
      AFROMESSAGE_TOKEN: ${AFROMESSAGE_TOKEN:?AFROMESSAGE_TOKEN is required}
      AFROMESSAGE_SENDER: ${AFROMESSAGE_SENDER:-}
      AFROMESSAGE_IDENTIFIER_ID: ${AFROMESSAGE_IDENTIFIER_ID:-}
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET is required}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      APP_TIMEZONE: Africa/Addis_Ababa
      LOG_FORMAT: json
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      blnk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  blnk_postgres_data:
